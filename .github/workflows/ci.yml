name: Python regression and package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and AWS SDK
        run: python -m pip install -e '.[aws]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Run offline sandbox evaluation
        run: python sandbox/local_evaluation.py
        env:
          PYTHONPATH: src
      - name: Verify installed command
        run: aws-triage --help
      - name: Check source compiles
        run: python -m compileall -q src tests sandbox

  infrastructure-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cfn-lint
        run: python -m pip install 'cfn-lint>=1,<2'
      - name: Validate sandbox template
        run: cfn-lint sandbox/template.yaml

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Archive distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          retention-days: 7
