name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python sandbox/local_evaluation.py
        env:
          PYTHONPATH: src
      - run: python sandbox/evaluate_agent.py
        env:
          PYTHONPATH: src
      - run: python sandbox/evaluate_model.py --out reports/model-preflight.json
        env:
          PYTHONPATH: src
  aws-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[aws]' 'cfn-lint>=1,<2'
      - run: python -m unittest discover -s tests -v
      - run: cfn-lint sandbox/template.yaml
